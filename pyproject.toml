[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-triage"
version = "0.1.0"
description = "Route customer-support messages to the right intent with a fine-tuned small encoder, escalating only uncertain tickets to an expensive LLM."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "huggingface_hub>=0.23", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
train = [
  "torch>=2.2", "transformers>=4.48", "datasets>=2.19", "accelerate>=0.30",
  "mlflow>=2.14", "scikit-learn>=1.4",
]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
