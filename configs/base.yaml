# Every tunable parameter lives here. Platform files under configs/platform/ extend this.
paths:
  data: data
  artifacts: artifacts

data:
  dataset_id: PolyAI/banking77        # verify in T-02
  revision: 1846984189f2bc0ac51c6fc3a600fa9e1714e0c6   # pinned in T-02
  oos_dataset_id: clinc_oos           # stretch; verified in T-02
  oos_revision: 155b9c710419136e17307b80d0a13e68cd46b4ec  # pinned in T-02
  oos_config: plus                    # CLINC150 subdirectory (plus | small | imbalanced)
  oos_label_column: intent
  validation_fraction: 0.1
  seed: 13
  max_train_samples: null
  max_eval_samples: null
  allow_label_change: false

model:
  base_id: answerdotai/ModernBERT-base  # verified in T-02
  revision: 8949b909ec900327062f0ebf497f51aef5e6f0c8  # pinned in T-02
  max_length: 128

train:
  seed: 13
  device: auto
  epochs: 5
  batch_size: 32
  micro_batch_size: null      # set below batch_size on small GPUs: gradients are accumulated, the update is unchanged
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  eval_every_steps: 100
  log_every_steps: 20
  save_every_steps: 500
  early_stopping_patience: 5
  resume: true                # continue from artifacts/checkpoints/last.pt when the config matches

predict:
  batch_size: 64
  split: test
  latency_warmup_calls: 20
  latency_calls: 200

routing:
  select: validation          # validation | fixed
  confidence_threshold: 0.80  # used when select = fixed, and as the starting point
  target_accuracy: null       # null = baseline accuracy on validation
  sweep_step: 0.01            # thresholds 0.00, 0.01, ..., 1.00, plus "escalate everything"

baseline:
  model: null                 # name of the expensive model; set before T-05
  usd_per_1m_input_tokens: null
  usd_per_1m_output_tokens: null
  prompt_file: configs/baseline/prompt.yaml
  label_descriptions_file: configs/baseline/label_descriptions.yaml
  max_output_tokens: 20
  bundle_dir: platforms/databricks/baseline/inputs   # written by `make baseline-bundle`, git-ignored

cost:
  gpu_usd_per_hour: 0.60      # replace with your actual rate
  small_tickets_per_second: null   # filled from measured throughput
  baseline_usd_per_ticket: null    # filled from the baseline run

business:
  tickets_per_month: 100000
  minutes_lost_per_misroute: 6
  agent_usd_per_hour: 25

feedback:
  predictions_log: feedback/predictions_log.jsonl
  review_queue: feedback/review_queue.csv
  corrections: feedback/corrections.jsonl
  review_threshold: 0.80
  audit_rate: 0.02

tracking:
  uri: null
  experiment: support-ticket-triage
